name: sample
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image_picker: ^1.0.7
  file_picker: ^10.3.10
  url_launcher: ^6.2.5
  fluttertoast: ^8.2.10
  dio: ^5.7.0
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.3
  intl: ^0.19.0
  webview_flutter: ^4.4.2




flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    

  fonts:
    - family: Mulish
      fonts:
        - asset: assets/fonts/Mulish-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mulish-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mulish-Bold.ttf
          weight: 700
