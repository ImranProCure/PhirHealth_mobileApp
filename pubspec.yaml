name: sample
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  image_picker: ^1.0.7
  file_picker: ^10.3.10
  url_launcher: ^6.2.5
  fluttertoast: ^8.2.10
  dio: ^5.7.0
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.3
  intl: ^0.19.0
  webview_flutter: ^4.4.2
  youtube_player_flutter: ^9.1.1
  visibility_detector: ^0.4.0+2
    # ← replaces youtube_player_flutter entirely

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.13.1

# NO dependency_overrides needed at all

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/

  fonts:
    - family: Mulish
      fonts:
        - asset: assets/fonts/Mulish-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mulish-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mulish-Bold.ttf
          weight: 700


flutter_icons:
  
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  background_color: "#FFFFFF"