name: sample
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_dotenv: ^5.1.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3

  # State Management
  get: ^4.6.6

  # Network
  dio: ^5.3.3

  # Media
  image_picker: ^1.0.7
  file_picker: ^10.2.0

  # Utils
  url_launcher: ^6.3.1
  fluttertoast: ^8.2.10
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  package_info_plus: ^8.0.2

  # WebView
  flutter_inappwebview: ^6.0.0  # ✅ Added missing package

  # Video
  youtube_player_flutter: ^9.1.1
  visibility_detector: ^0.4.0+2
  shimmer: ^3.0.0
  flutter_local_notifications: ^18.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  timezone: ^0.9.4
  
  path_provider: ^2.1.2
  open_file: ^3.3.2
  pdf: ^3.10.8

    # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_analytics: ^11.0.0
  phonepe_payment_sdk: ^2.0.0   # ← add this
  # flutter_timezone: ^3.0.0
    # ← replaces youtube_player_flutter entirely

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  geolocator: ^11.0.0
  webview_flutter: ^4.10.0


flutter:
  uses-material-design: true

  assets:
    - .env   
    - assets/
    - assets/icons/
  

  fonts:
    - family: Mulish
      fonts:
        - asset: assets/fonts/Mulish-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mulish-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mulish-Bold.ttf
          weight: 700

flutter_icons:
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  background_color: "#FFFFFF"